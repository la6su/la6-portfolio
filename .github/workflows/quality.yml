name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type, unit, lint, and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify generated outputs match their sources
        run: >-
          git diff --exit-code -- dist blog.html blog/ prerender/home.html public/sitemap.xml
      - run: bun run type-check:vue
      - run: bun run test:unit
      - run: bun run lint
      - run: bun run check:stdlib

  browsers:
    name: Production browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:matrix
      - run: bun run test:host-teardown
